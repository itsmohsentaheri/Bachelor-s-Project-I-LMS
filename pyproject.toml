version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohsen", email = "mohsentaheri670@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=0.9.9",
    "openai>=3.45.0",
    "psycopg>=3.3.6",
    "sqlalchemy>=2.1.8",
    "pgvector>=0.5.1",
    "pypdf>=7.1.0",
    "tiktoken>=0.14.0",
